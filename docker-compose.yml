services:
  gluetun:
    image: qmcgaw/gluetun:latest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${VPN_USER}
      - OPENVPN_PASSWORD=${VPN_PASSWORD}
      - SERVER_COUNTRIES=${VPN_COUNTRY:-Switzerland}
      # Free-tier Proton accounts can only connect to free-tier servers —
      # with this on, gluetun won't pick a paid-only server the account has no
      # access to and fail auth. On a paid plan it must be off, or you're
      # restricted to ~10 countries for no reason. Set VPN_FREE_ONLY=on in
      # .env if you ever go back to a free account.
      - FREE_ONLY=${VPN_FREE_ONLY:-off}
      # TCP survives restrictive networks that drop UDP, which is why it was
      # chosen while fighting the free tier. UDP is meaningfully faster for
      # downloads and paid Proton servers support it — VPN_PROTOCOL=udp in
      # .env is worth trying, and costs one gluetun restart to undo.
      - OPENVPN_PROTOCOL=${VPN_PROTOCOL:-tcp}
      - HTTPPROXY=on
    healthcheck:
      test: ["CMD-SHELL", "ping -c 1 -W 10 1.1.1.1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    networks:
      - app-network

  # Generates the proof-of-origin token YouTube now requires before serving
  # video data — without it, yt-dlp gets "Sign in to confirm you're not a
  # bot" on IPs it doesn't trust (routine for shared/commercial VPN exits
  # like Surfshark's). Stays off the VPN network entirely: it only talks to
  # YouTube's token endpoint, not video traffic, and doesn't need the proxy.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    init: true
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ${MUSIC_DIR:-./music}:/music
      - db_data:/app/data
    environment:
      - PORT=3001
      - MUSIC_DIR=/music
      - DB_PATH=/app/data/music.db
      - JWT_SECRET=${JWT_SECRET:-insecure-default-change-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SECURE_COOKIE=${SECURE_COOKIE:-true}
      - YTDLP_PROXY=http://gluetun:8888
      - YTDLP_POT_PROVIDER_URL=http://bgutil-provider:4416
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      # Radio suggestions come from YouTube Music, with Last.fm as fallback.
      # Held OFF while YouTube Music's reliability is being judged on its own:
      # with the fallback silenced, a lookup it fails is visible instead of
      # being quietly covered up. Set RADIO_LASTFM_FALLBACK=on in .env to
      # restore the fallback — the Last.fm code is untouched.
      - RADIO_LASTFM_FALLBACK=${RADIO_LASTFM_FALLBACK:-off}
    depends_on:
      gluetun:
        condition: service_healthy
      bgutil-provider:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4000:443"
    volumes:
      - /var/lib/tailscale/certs:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network
      # Lets nginx reach the quarc-auth container by name for /api/auth/* —
      # see MIGRATION.md / the Quarc_Notes repo for how quarc-auth is deployed.
      - quarcnet-shared

networks:
  app-network:
    driver: bridge
  quarcnet-shared:
    external: true

volumes:
  db_data:
